name: Gridman CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - gridman/develop
      - workspace-git-sync
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build:web
